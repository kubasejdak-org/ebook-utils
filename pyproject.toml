[project]
name = "ebook-utils"
version = "0.1.0"
description = "Utility tools for working with ebook files"
requires-python = ">=3.14"
dependencies = [
    "ebooklib>=0.18",
    "lxml>=5.0",
    "pypdf>=4.0",
    "typer>=0.12",
]

[project.optional-dependencies]
ai-openai = ["openai>=1.0"]
ai-claude = ["anthropic>=0.34"]
ai = ["openai>=1.0", "anthropic>=0.34"]
test = ["pytest>=8.0"]

[project.scripts]
ebook-utils = "ebook_utils:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
