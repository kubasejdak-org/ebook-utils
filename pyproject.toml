[project]
name = "ebook-utils"
version = "0.1.0"
description = "Utility tools for working with ebook files"
requires-python = ">=3.14"
dependencies = [
    "ebooklib>=0.18",
    "lxml>=5.0",
    "pypdf>=4.0",
    "typer>=0.12",
]

[project.scripts]
ebook-utils = "ebook_utils:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
